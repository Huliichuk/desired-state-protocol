# Fly.io configuration for a public DSP demo runtime.
#
# Fly is used rather than a serverless platform because DSP is a long-lived
# stateful process: plans, approvals, operations, idempotency keys and the audit
# chain live in SQLite on disk. A serverless function has no durable filesystem,
# so the audit chain — the thing that makes an apply reviewable after the fact —
# would vanish between invocations.
#
# See deploy/README.md for the four commands that put this online.

app = 'dsp-demo'
primary_region = 'fra'

[build]
dockerfile = '../../Dockerfile'

[env]
DSP_HOST = '0.0.0.0'
DSP_PORT = '4040'

# This is a demo, and it says so. The environment name feeds the risk score, so
# calling it `demo` keeps plans out of the production risk band.
DSP_ENVIRONMENT = 'demo'
DSP_TENANT = 'demo'

DSP_DATABASE = '/data/runtime.sqlite'
DSP_MOCK_DATABASE = '/data/mock.sqlite'

# Only the mock provider is compiled in, so the "external system" this runtime can
# change is a SQLite file inside its own container. No real service is reachable
# from here, and there are no real credentials to leak.
DSP_SECRET_STORE = 'env'

# Deletions and replacements stay refused. Do not turn this on for a public demo.
DSP_ALLOW_DESTRUCTIVE = 'false'

DSP_LOG_LEVEL = 'info'
DSP_LOG_PRETTY = 'false'

# A demo gets a short plan window so stale plans clear themselves out.
DSP_PLAN_TTL_SECONDS = '600'

[http_service]
internal_port = 4040
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
# Zero is deliberate: the demo sleeps when nobody is using it. The volume keeps
# the audit chain across restarts.
min_machines_running = 0

[[http_service.checks]]
grace_period = '10s'
interval = '30s'
method = 'GET'
timeout = '5s'
path = '/health'

# Plans, approvals, operations and the audit chain must survive a restart, so the
# data directory is a real volume rather than the ephemeral rootfs.
[[mounts]]
source = 'dsp_data'
destination = '/data'

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
