services:
  dsp:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsp-runtime:0.1.0
    ports:
      - '4040:4040'
    environment:
      # Required in a container. Without it the server generates a token per
      # process and prints it, which nothing outside the container can read.
      DSP_AUTH_TOKEN: ${DSP_AUTH_TOKEN:?set DSP_AUTH_TOKEN in your shell or .env}

      DSP_HOST: 0.0.0.0
      DSP_PORT: '4040'
      DSP_ENVIRONMENT: ${DSP_ENVIRONMENT:-local}
      DSP_TENANT: ${DSP_TENANT:-local}

      DSP_DATABASE: /data/runtime.sqlite
      DSP_MOCK_DATABASE: /data/mock.sqlite

      # Secrets. `env` reads DSP_SECRET_* variables; `encrypted-file` needs both
      # DSP_SECRET_FILE and a 32-byte DSP_SECRET_MASTER_KEY.
      DSP_SECRET_STORE: ${DSP_SECRET_STORE:-env}

      # Destructive changes stay off unless you deliberately turn them on.
      DSP_ALLOW_DESTRUCTIVE: 'false'

      DSP_LOG_LEVEL: ${DSP_LOG_LEVEL:-info}
      DSP_LOG_PRETTY: 'false'

      # Uncomment together with the policies mount below.
      # DSP_POLICY_DIR: /policies

    volumes:
      - dsp-data:/data
      # A reviewed policy bundle, mounted read-only:
      # - ./examples/mock-workspace/policies:/policies:ro

    restart: unless-stopped

    # DSP 0.1 serves plain HTTP. Terminate TLS in front of it before exposing it
    # beyond a trusted network.

volumes:
  dsp-data:
