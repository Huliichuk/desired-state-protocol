# The same workspace after two edits:
#   - the analyst is promoted to member
#   - the sessions table gains a `last_seen_at` column
#   - the `analyst@example.com` subscription is added
#
# Plan this against the applied state from `desired-state.yaml` to see UPDATE
# and NOOP changes side by side.
apiVersion: dsp.dev/v1alpha1
kind: MockWorkspace
metadata:
  name: dsp-demo
  namespace: default
  labels:
    team: platform
spec:
  databases:
    - name: main
      engine: postgres
      region: eu-central-1
      sizeGb: 40
      tables:
        - name: users
          columns:
            - name: id
              type: text
            - name: email
              type: text
            - name: created_at
              type: timestamp
        - name: sessions
          columns:
            - name: id
              type: text
            - name: user_id
              type: text
            - name: expires_at
              type: timestamp
              nullable: true
            - name: last_seen_at
              type: timestamp
              nullable: true

  users:
    - email: founder@example.com
      role: admin
      displayName: Founder
    - email: analyst@example.com
      role: member
      displayName: Analyst

  subscriptions:
    - user: founder@example.com
      plan: pro
      amountCents: 2900
      currency: eur
      active: true
    - user: analyst@example.com
      plan: starter
      amountCents: 900
      currency: eur
      active: true
