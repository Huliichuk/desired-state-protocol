name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: version and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Changesets compares against history to work out what changed.
          fetch-depth: 0
          # The GitHub API performs every write in this workflow.
          persist-credentials: false

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nothing gets versioned unless it builds and its tests pass.
      - run: pnpm build
      - run: pnpm test

      # With pending changesets this opens or updates a "Version packages" pull
      # request that bumps every version and writes the changelogs. With none
      # pending it does nothing, and the release step below takes over.
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm changeset version
          commit: 'Version packages'
          title: 'Version packages'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every @dsp/* package moves together (see .changeset/config.json), so one
      # version describes the whole repository and one tag is enough.
      - name: Read the current version
        id: version
        run: echo "value=$(node -p "require('./packages/protocol/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the GitHub release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"

          # A completed release is the idempotency boundary. A tag alone may be
          # left behind if a previous run was interrupted between the two writes.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi

          node scripts/release-notes.mjs "$VERSION" > /tmp/notes.md
          cat /tmp/notes.md

          if git rev-parse "$tag" >/dev/null 2>&1; then
            # Resume after a run that created the tag but not the release.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "DSP $tag" \
              --notes-file /tmp/notes.md
          else
            # `gh` creates the tag and release through one API-facing operation.
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DSP $tag" \
              --notes-file /tmp/notes.md
          fi

      # Publishing to npm is deliberately off while the protocol is pre-1.0. To
      # turn it on: add an NPM_TOKEN secret and give the changesets step above
      # `publish: pnpm changeset publish`.
