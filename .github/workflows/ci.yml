name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 22+ is required: the runtime uses the built-in node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # The published JSON Schemas are generated artifacts. If a protocol change
      # forgot to regenerate them, the working tree is dirty here.
      - name: Published schemas are in sync
        run: |
          node packages/protocol/dist/scripts/generate-schemas.js
          git diff --exit-code -- schemas/

  lifecycle:
    name: end-to-end lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Walk discover -> validate -> plan -> approve -> apply -> verify
        env:
          DSP_AUTH_TOKEN: ci-token
          DSP_PORT: '4040'
          DSP_LOG_LEVEL: error
          DSP_POLICY_DIR: examples/mock-workspace/policies
          NO_COLOR: '1'
        run: |
          node apps/server/dist/main.js &
          for _ in $(seq 1 60); do curl -sf localhost:4040/health >/dev/null && break; sleep 0.5; done

          DSP="node apps/cli/dist/main.js --server http://127.0.0.1:4040 --token ci-token"
          FILE=examples/mock-workspace/desired-state.yaml

          $DSP discover
          $DSP validate --file "$FILE"
          $DSP plan --file "$FILE"

          PLAN=$($DSP --json plan --file "$FILE" | node -e \
            "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).metadata.id))")

          # Applying without --confirm must refuse with exit 8 and change nothing.
          set +e; $DSP apply "$PLAN"; test $? -eq 8 || exit 1; set -e

          # Applying without approval must refuse with exit 3.
          set +e; $DSP apply "$PLAN" --confirm; test $? -eq 3 || exit 1; set -e

          $DSP approve "$PLAN" --by ci --reason "CI run"
          $DSP apply "$PLAN" --confirm
          $DSP audit verify

  versioning:
    name: versioning discipline
    # Pull requests only: this checks what a change declares about itself, which
    # is meaningless once the change is already on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}:${{ github.base_ref }}"

      # A change to a released package without a changeset means the release notes
      # will not mention it and no version will move. CONTRIBUTING.md promises a
      # changeset; this is what keeps the promise.
      - name: A changed package declares a changeset
        run: pnpm changeset status --since="${{ github.base_ref }}"

      # The protocol version and the package version move independently, but a
      # protocol version bump without a specification change is always a mistake:
      # clients read that number to decide whether they can talk to the runtime.
      - name: A protocol version bump comes with the specification
        env:
          BASE: ${{ github.base_ref }}
        run: |
          current=$(grep -oE "DSP_PROTOCOL_VERSION = '[^']+'" packages/protocol/src/version.ts)
          previous=$(git show "$BASE:packages/protocol/src/version.ts" \
            | grep -oE "DSP_PROTOCOL_VERSION = '[^']+'" || echo "")

          if [ "$current" = "$previous" ]; then
            echo "Protocol version unchanged: $current"
            exit 0
          fi

          echo "Protocol version changed: ${previous:-none} -> $current"
          changed=$(git diff --name-only "$BASE"...HEAD)

          for required in SPEC.md schemas; do
            if ! echo "$changed" | grep -q "^$required"; then
              echo "::error::The protocol version changed but $required did not."
              echo "A protocol change must update SPEC.md and the published schemas together."
              exit 1
            fi
          done
          echo "SPEC.md and schemas/ were updated alongside the protocol version."
